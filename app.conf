project_schema {
    project_name: project
    list_apps: apps
    play_store: android
    app_store: ios
}
app {
    logging_level: "DEBUG"
    logging_level: ${?LOGGING}
    logging_level_modules: "INFO"
    logging_level_modules: ${?LOGGING_MODULES}
    logger: [Base, urllib3.connectionpool, urllib3.util.retry]
    logs_file: "scraper"
    logs_file: ${?LOGS_FILE}
    sleep: {
        apple_store: 10
       google_store: 3
        loop: 3
    }
    refresh_weeks: 1.0
    review_count: -1
}
healthcheck: ""
healthcheck: ${?HEALTH_CHECK}
location {
    main: data/
    main: ${?DATA_LOCATION}
    input: data/apps/
    input: ${?INPUT_LOCATION}
    app_store: app-store
    play_store: play-store
}
